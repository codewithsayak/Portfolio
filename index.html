<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060b" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Sayak Karmakar — frontend developer and interface designer. Fast, accessible interfaces with motion that means something."
    />
    <meta property="og:title" content="Sayak Karmakar — Frontend Developer" />
    <meta
      property="og:description"
      content="I build fast, accessible interfaces — and make them move."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

    <!-- Paint the page background before any stylesheet or font resolves. -->
    <style>
      html,
      body {
        background-color: #05060b;
        color: #f4f6ff;
        margin: 0;
      }
      #root {
        min-height: 100svh;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts are preloaded and applied without blocking the first paint. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <noscript>
      <style>
        .reveal-word__inner {
          opacity: 1 !important;
          transform: none !important;
          animation: none !important;
        }
      </style>
    </noscript>

    <title>Sayak Karmakar — Frontend Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
